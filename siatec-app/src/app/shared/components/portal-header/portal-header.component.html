<p-toolbar class="portal-header">
  <!-- Left: Menu + Brand -->
  <div class="header-left">
    <button
      id="header-menu-toggle-btn"
      pButton
      type="button"
      class="menu-toggle-button"
      (click)="onMenuToggle()"
      aria-label="Abrir menú principal"
    >
      <i class="pi pi-bars"></i>
      <span class="menu-toggle-label">Menú</span>
    </button>
    <span class="brand-mark">{{ title }}</span>
    <span class="brand-tag">{{ subtitle }}</span>
  </div>

  <!-- Right: Actions -->
  <div class="header-right">
    <button
      id="header-siatecbot-btn"
      pButton
      type="button"
      class="siatecbot-button"
      (click)="onSiatecBotClick()"
      aria-label="SiatecBot - Asistente Virtual"
    >
      <img src="assets/img/SiatecBot.png" alt="SiatecBot" class="bot-icon" />
    </button>

    <button
      id="header-notifications-btn"
      pButton
      type="button"
      class="notification-button"
      (click)="onNotificationsClick()"
      aria-label="Notificaciones"
    >
      <i class="pi pi-bell"></i>
      <p-badge *ngIf="notifications > 0" [value]="notifications" [severity]="badgeSeverity"></p-badge>
    </button>

    <div class="user-menu-container">
      <button id="header-user-menu-btn" type="button" class="user-button" pButton (click)="userMenu.toggle($event)" aria-label="Menú de usuario">
        <p-avatar [label]="initials" shape="circle" class="user-avatar"></p-avatar>
        <span class="user-name">{{ userName }}</span>
        <i class="pi pi-chevron-down chevron"></i>
      </button>
      <p-tieredMenu #userMenu [popup]="true" [model]="internalMenu" styleClass="portal-user-menu" [appendTo]="'body'"></p-tieredMenu>
    </div>
  </div>
</p-toolbar>
