<div class="shell">
  <header class="shell-header shell-header--flush">
    <app-portal-header
      title="SIATEC"
      subtitle="Portal Tributario"
      [userName]="userName"
      [userEmail]="userEmail"
      [notifications]="notificationsCount()"
      badgeSeverity="danger"
      [showMenuButton]="true"
      (profile)="onProfile()"
      (settings)="onSettings()"
      (logout)="onLogout()"
      (notificationsClick)="onNotificationsClick()"
      (menuToggle)="toggleMobileSidebar()"
    ></app-portal-header>
  </header>

  <p-drawer
    [(visible)]="mobileSidebarVisible"
    position="left"
    [modal]="true"
    [dismissible]="true"
    [blockScroll]="true"
    styleClass="shell-mobile-drawer"
    ariaCloseLabel="Cerrar menú"
  >
    <ng-container *ngTemplateOutlet="sidebarNav"></ng-container>
  </p-drawer>

  <div class="shell-body">
    <div class="shell-sidebar">
      <ng-container *ngTemplateOutlet="sidebarNav"></ng-container>
    </div>

    <main class="shell-main">
      <section class="shell-main-content">
        <div class="shell-main-surface">
          <router-outlet></router-outlet>
        </div>
      </section>
    </main>
  </div>

  <footer class="shell-footer">
    <span>&copy; {{ footerYear }} SIATEC. Todos los derechos reservados.</span>
  </footer>

  <ng-template #sidebarNav>
    <app-sidebar-nav
      title="Panel de Control"
      [items]="navItems()"
      [activeKey]="activeKey()"
      (select)="onSidebarSelect($event)"
    ></app-sidebar-nav>
  </ng-template>
</div>
