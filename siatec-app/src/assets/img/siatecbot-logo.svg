<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="botGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7b1fa2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a148c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="50" cy="50" r="48" fill="url(#botGradient)"/>
  
  <!-- Cabeza del bot -->
  <circle cx="50" cy="45" r="22" fill="white"/>
  
  <!-- Antena -->
  <line x1="50" y1="23" x2="50" y2="15" stroke="white" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="12" r="3" fill="white"/>
  
  <!-- Ojos -->
  <circle cx="43" cy="42" r="3" fill="#7b1fa2"/>
  <circle cx="57" cy="42" r="3" fill="#7b1fa2"/>
  
  <!-- Boca sonriente -->
  <path d="M 43 50 Q 50 55 57 50" stroke="#7b1fa2" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Cuerpo -->
  <rect x="35" y="62" width="30" height="20" rx="3" fill="white"/>
  
  <!-- Brazos -->
  <rect x="25" y="67" width="10" height="4" rx="2" fill="white"/>
  <rect x="65" y="67" width="10" height="4" rx="2" fill="white"/>
  
  <!-- Detalles del cuerpo -->
  <circle cx="44" cy="72" r="2" fill="#7b1fa2"/>
  <circle cx="56" cy="72" r="2" fill="#7b1fa2"/>
</svg>
