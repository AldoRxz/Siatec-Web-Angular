# nginx.conf optimizado para Angular SPA
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Logs
  log_format  main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log  /var/log/nginx/access.log  main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout  65;
  types_hash_max_size 4096;
  server_tokens off;

  # Compresión
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml+rss image/svg+xml;
  gzip_min_length 1024;
  gzip_comp_level 5;

  # Cache estática (excepto index y config)
  map $uri $cache_control_header {
    default "public, max-age=31536000, immutable";
    ~/index\.html$ "no-cache";
    ~/config\.js$ "no-cache";
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Inyección dinámica de config (generado por entrypoint)
    location = /config.js {
      add_header Cache-Control "no-cache";
    }

    # Angular routing - todas las rutas van a index.html
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control $cache_control_header;
    }

    # Cache para archivos estáticos JS/CSS
    location ~* \.(?:css|js|mjs)$ {
      add_header Cache-Control $cache_control_header;
    }

    # Cache para imágenes
    location ~* \.(?:png|jpg|jpeg|webp|gif|svg|ico)$ {
      add_header Cache-Control "public, max-age=604800";
    }

    # Seguridad básica
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy no-referrer-when-downgrade always;
    add_header Content-Security-Policy "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval';" always;
  }
}
